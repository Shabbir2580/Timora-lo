name: Timora TypeScript Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install pnpm before setup-node because setup-node's pnpm cache
      # requires pnpm to already be available on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      # Build with non-secret placeholders: this validates compilation and route
      # generation without connecting to the live Supabase project.
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-placeholder-key
